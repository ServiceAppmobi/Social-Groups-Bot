name: 📱 ServiceApp Social Groups Bot (WhatsApp / Facebook / TikTok)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tryb uruchomienia bota'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - mock
          - test-gemini

jobs:
  scan-social-groups:
    name: Skanowanie publicznych wzmianek FB / TikTok / WhatsApp (BR & MX)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Przywróć bazę leads.db
        uses: actions/cache/restore@v4
        with:
          path: leads.db
          key: social-groups-db-${{ github.run_id }}
          restore-keys: |
            social-groups-db-

      - name: Uruchom bota
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_PLAY_URL: ${{ vars.GOOGLE_PLAY_URL || 'https://play.google.com/store/apps/details?id=pl.serviceapp&pli=1' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ inputs.mode || 'live' }}"
          if [ "$MODE" = "mock" ]; then
            python3 main.py --mock
          elif [ "$MODE" = "test-gemini" ]; then
            python3 main.py --test-gemini
          else
            python3 main.py
          fi

      - name: Zapisz bazę leads.db
        if: always() && hashFiles('leads.db') != ''
        uses: actions/cache/save@v4
              - name: Wyślij raport mailem przez Resend
        if: always()
        run: |
          curl -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "ServiceApp Bot <onboarding@resend.dev>",
              "to": ["${{ secrets.MAIL_TO }}"],
              "subject": "Social-Groups-Bot - Raport z linkami - Run ${{ github.run_number }}",
              "html": "<h2>ServiceApp - Raport Social-Groups-Bot</h2><p>Run: ${{ github.run_number }} | Status: ${{ job.status }}</p><p>Panel: <a href=\"https://serviceappmobi.github.io/Social-Groups-Bot/\">Otworz panel</a></p><p>Run: <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Zobacz run na GitHubie</a></p><h3>Facebook</h3><ul><li><a href=\"https://www.facebook.com/search/posts/?q=preciso%20de%20encanador\">FB: preciso de encanador</a></li><li><a href=\"https://www.facebook.com/groups/search/?q=Servicos\">FB Grupy: Servicos</a></li></ul><h3>TikTok</h3><ul><li><a href=\"https://www.tiktok.com/search?q=encanador\">TikTok: encanador</a></li></ul><h3>WhatsApp & Lokalne</h3><ul><li><a href=\"https://www.google.com/search?q=Grupy+WhatsApp\">Google: Grupy WhatsApp</a></li><li><a href=\"https://www.reddit.com/r/saopaulo/new/\">Reddit: r/saopaulo</a></li><li><a href=\"https://mastodon.social/tags/saopaulo\">Mastodon: #saopaulo</a></li></ul><p>Pelny raport tez w Issues w repo.</p>"
            }'
        with:
          path: leads.db
          key: social-groups-db-${{ github.run_id }}
