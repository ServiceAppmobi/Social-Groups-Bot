name: ServiceApp Client Bot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchom bota do klientow
        run: python client_bot.py

      - name: Wyslij gotowe odpowiedzi na email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ServiceApp - Gotowe odpowiedzi dla klientow
          to: ${{ secrets.MAIL_TO }}
          from: ServiceApp Bot
          body: |
            Bot do klientow skonczyl prace.
            Gotowe odpowiedzi sa w zalaczniku drafts.md
            Pamietaj: max 5-10 odpowiedzi dziennie, tylko tam gdzie ktos naprawde szuka uslugi.
          attachments: out/drafts.md

      - name: Zapisz wyniki
        uses: actions/upload-artifact@v4
        with:
          name: drafts-klient
          path: out/
