name: ServiceApp Client Bot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchom bota do klientow
        run: python client_bot.py

      - name: Wyslij gotowe odpowiedzi na email przez Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python -c "
          import os, json, urllib.request
          with open('out/drafts.md', encoding='utf-8') as f:
              text = f.read()
          data = {
              'from': os.environ['EMAIL_SENDER'],
              'to': [os.environ['EMAIL_RECIPIENT']],
              'subject': 'ServiceApp - Gotowe odpowiedzi dla klientow',
              'text': text + '\n\nPamietaj: max 5-10 odpowiedzi dziennie, tylko tam gdzie ktos naprawde szuka uslugi.'
          }
          req = urllib.request.Request(
              'https://api.resend.com/emails',
              data=json.dumps(data).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['RESEND_API_KEY'], 'Content-Type': 'application/json'},
              method='POST'
          )
          print(urllib.request.urlopen(req).read().decode())
          print('EMAIL WYSLANY')
          "

      - name: Zapisz wyniki
        uses: actions/upload-artifact@v4
        with:
          name: drafts-klient
          path: out/
