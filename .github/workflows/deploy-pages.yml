name: Deploy Radar Panel na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Przygotuj panel HTML
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp dashboard.html _site/dashboard.html

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Wyślij artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
