name: Deploy Radar Panel na 【entity-GitHub¦canonical_name=GitHub】 Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Landing Pages
        run: |
          ls -la
          if [ -f "generate_landing.py" ]; then
            echo "Found generate_landing.py, running it"
            python generate_landing.py
          else
            echo "No generator found"
            mkdir -p _site
          fi
          mkdir -p _site
          if [ ! -f "_site/index.html" ]; then
            cp index.html _site/index.html 2>/dev/null || echo "<h1>ServiceApp</h1>" > _site/index.html
          fi
          ls -la _site/
          ls -la _site/landing/ || echo "No landing folder"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
